    --primary: #0b2e23; 
    --secondary: #c5a059;
    --text-main: #2c3e50; 
    --text-muted: #6b7c93;
    --success-bg: rgba(46, 125, 50, 0.08);
    --success-text: #2e7d32;
    --danger-bg: rgba(198, 40, 40, 0.08);
    --danger-text: #c62828;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  ::selection { background: rgba(197, 160, 89, 0.35); color: #1a2c3d; }
  :focus-visible { outline: 2px solid rgba(197, 160, 89, 0.6); outline-offset: 3px; }
  
  html {
    background-color: #eae7e2;
  }

  body {
    background: transparent;
    color: var(--text-main);
    font-family: 'Tajawal', sans-serif; 
    min-height: 100vh; 
    min-height: 100dvh;
    overflow-x: hidden; 
    font-size: 17px;
    position: relative;
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background-image: var(--bg-image);
    background-repeat: repeat-y;
    background-position: top center;
    background-size: 100% auto;
    background-color: #eae7e2;
    z-index: -3;
    pointer-events: none;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.22;
    z-index: -1;
    pointer-events: none;
  }
  .blob-1 { width: 500px; height: 500px; background: #8a6d2f; top: -160px; right: -140px; }
  .blob-2 { width: 460px; height: 460px; background: #0b2e23; top: 950px; left: -170px; }
  .blob-3 { width: 420px; height: 420px; background: #8a6d2f; top: 1950px; right: -130px; }
  .blob-4 { width: 440px; height: 440px; background: #0b2e23; top: 2850px; left: -150px; }

  .dashboard-wrapper {
    background: transparent;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s cubic-bezier(.16,1,.3,1), transform 0.8s cubic-bezier(.16,1,.3,1);
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  .hero-card {
    opacity: 0;
    transform: translateY(30px) scale(0.98);
    animation: heroIn 0.9s cubic-bezier(.22,1,.36,1) 0.1s forwards;
  }
  @keyframes heroIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  header { padding: 170px 20px 25px; text-align: center; }
  header h1 { 
    font-family: 'Tajawal', sans-serif; 
    font-size: clamp(32px, 6.5vw, 48px); 
    color: var(--primary); 
    font-weight: 900; 
    letter-spacing: -0.5px;
    text-shadow: 0 2px 10px rgba(11, 46, 35, 0.08);
  }
  header p { 
    color: var(--secondary); 
    font-size: 17px; 
    margin-top: 8px; 
    font-weight: 800; 
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzXfcGvNVt4cJy5svPGxugGD8YGv_OyEeCE-Ee9-E34FEXDX30vfZP4tBwBruNG-DXIvg/exec";

let allMembersData = [];

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function loadData() {
  try {
    const response = await fetch(API_URL);
    const data = await response.json();
    
    if(data.error) {
      document.getElementById('appContainer').innerHTML = '<div class="loading" style="color:#c62828;">خطأ في جلب البيانات: ' + escapeHtml(data.error) + '</div>';
      return;
    }

    renderApp(data);
  } catch(e) {
    document.getElementById('appContainer').innerHTML = '<div class="loading" style="color:#c62828;">عذراً، تعذر الاتصال بقاعدة البيانات.</div>';
  }
}

function fmt(num) {
  return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderApp(d) {
  allMembersData = d.members;

  const lateListHtml = d.lateMembers.length === 0
    ? '<div class="empty-late reveal">✓ جميع الأعضاء منتظمون في السداد لهذا الشهر.</div>'
    : d.lateMembers.map((m, idx) => {
        const cycles = Number(m.cyclesLate || m.lateCycles || 0);
        const cyclesLabel = cycles === 1 ? 'دورة واحدة' : cycles === 2 ? 'دورتان' : `${cycles} دورات`;
        const cyclesTag = cycles > 0 ? `<span class="tag cycles">${cyclesLabel}</span>` : '';
        return `<div class="late-item" style="animation-delay: ${idx * 0.08}s"><span>${escapeHtml(m.name)}</span> <span class="tag-group"><span class="tag">متأخر</span>${cyclesTag}</span></div>`;
      }).join('');

  const rowsHtml = d.members.map((m, idx) => `
    <tr style="animation: fadeInSlide 0.4s ease ${idx * 0.02}s forwards;">
      <td class="name">${escapeHtml(m.name)}</td>
      <td><span class="pill ${m.status === 'ok' ? 'ok' : 'late'}">${m.status === 'ok' ? 'منتظم' : 'متأخر'}</span></td>
      <td style="text-align: left; font-weight: 700; color: #8a6d2f; text-shadow: 0 1px 0 rgba(255,255,255,0.5);">${fmt(m.amount)} ﷼</td>
    </tr>
  `).join('');

  const expensesRowsHtml = d.expensesList.map((e, idx) => `
    <tr style="animation: fadeInSlide 0.4s ease ${idx * 0.03}s forwards;">
      <td style="text-align: right; color: #4a5a6b;">${escapeHtml(e.date)}</td>
      <td style="text-align: right; font-weight:500; color: #2c3e50;">${escapeHtml(e.description)}</td>
      <td style="text-align: left; font-weight: 700; color: #c0392b;">${e.amount.toLocaleString('en-US')} ﷼</td>
    </tr>
  `).join('');

  document.getElementById('appContainer').innerHTML = `
    <div class="glass-card hero-card">
      <div class="hero-box">
        <div class="label">الرصيد الحالي للصندوق</div>
        <div class="amount"><span class="count-num" data-count="${d.balance}">0</span><span>ريال</span></div>
        <div class="mini-stats-grid">
          <div class="mini-stat income">
            <div class="mini-label">إجمالي المساهمات</div>
            <div class="mini-value">${fmt(d.contributions)} ﷼</div>
          </div>
          <div class="mini-stat expense">
            <div class="mini-label">إجمالي السحوبات</div>
            <div class="mini-value">${fmt(d.expenses)} ﷼</div>
          </div>
        </div>
        <div class="last-update">
          <div class="sync-status">تمت مزامنة البيانات بنجاح</div>
          <div class="update-title">آخر تحديث</div>
          <div class="update-date">${escapeHtml(d.lastUpdateDate)}</div>
          <div class="update-time">${escapeHtml(d.lastUpdateTime)}</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="num"><span class="count-num" data-count="${d.okCount}">0</span></div>
          <div class="label">عضو منتظم</div>
        </div>
        <div class="stat-box warning">
          <div class="num"><span class="count-num" data-count="${d.lateMembers.length}">0</span></div>
          <div class="label">عضو متأخر</div>
        </div>
      </div>
    </div>

    <section class="reveal">
      <div class="section-header"><h2>المتأخرون عن السداد</h2></div>
      <div class="late-list">${lateListHtml}</div>
    </section>

    <section class="reveal">
      <div class="section-header"><h2>كشف الحسابات المفصل للأعضاء</h2></div>
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن اسم عضو أو حالة (منتظم/متأخر)...">
      <div class="table-wrapper table-container-mobile">
        <table>
          <thead>
            <tr>
              <th style="text-align: right; width: 45%;">الاسم</th>
              <th style="width: 25%; text-align: center;">الحالة <span class="scroll-hint">⟵</span></th>
              <th style="text-align: left; width: 30%;">إجمالي المساهمة</th>
            </tr>
          </thead>
          <tbody id="tableBody">${rowsHtml}</tbody>
        </table>
      </div>
    </section>

    ${d.expensesList.length > 0 ? `
    <section class="reveal">
      <div class="section-header"><h2>سجل المصروفات (السحوبات)</h2></div>
      <div class="table-wrapper table-container-mobile">
        <table>
          <thead>
            <tr>
              <th style="text-align: right; width: 30%;">التاريخ</th>
              <th style="text-align: right; width: 45%;">البيان / الوصف <span class="scroll-hint">⟵</span></th>
              <th style="text-align: left; width: 25%;">المبلغ</th>
            </tr>
          </thead>
          <tbody>${expensesRowsHtml}</tbody>
        </table>
      </div>
    </section>
    ` : ''}
  `;

  initAnimations();
  initSearch();
}

function initAnimations() {
  function animateCount(el){
    const target = parseFloat(el.getAttribute('data-count')) || 0;
    const isDecimal = target % 1 !== 0;
    const dur = 1700, start = performance.now();
    function ease(t){ return 1 - Math.pow(1 - t, 3); }
    function tick(now){
      const p = Math.min(1, (now - start) / dur);
      const val = target * ease(p);
      el.textContent = isDecimal ? val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                                  : Math.round(val).toLocaleString('en-US');
      if(p < 1) requestAnimationFrame(tick); 
      else {
        el.textContent = isDecimal ? target.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) : target.toLocaleString('en-US');
      }
    }
    requestAnimationFrame(tick);
  }
  
  document.querySelectorAll('.count-num').forEach(el => setTimeout(() => animateCount(el), 300));

  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:0.12});
  revealEls.forEach(el => io.observe(el));
}

function initSearch() {
  document.getElementById('searchInput').addEventListener('input', function(e) {
    const query = e.target.value.trim().toLowerCase();
    const tbody = document.getElementById('tableBody');
    const normalize = text => text.toLowerCase().replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").trim();

    let filtered;
    if (normalize(query) === "متاخر" || normalize(query) === "منتظم") {
      filtered = allMembersData.filter(m => normalize(m.status === 'ok' ? 'منتظم' : 'متأخر') === normalize(query));
    } else {
      filtered = allMembersData.filter(m => {
        const firstName = normalize(m.name.split(" ")[0]);
        return firstName.startsWith(normalize(query));
      });
    }
    if (filtered.length === 0) {
      filtered = allMembersData.filter(m => normalize(m.name).includes(normalize(query)));
    }
    
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-muted); padding: 20px;">لم يتم العثور على نتائج متطابقة</td></tr>';
      return;
    }
    
    tbody.innerHTML = filtered.map((m, i) => `
      <tr>
        <td class="name" style="font-weight: 700; color: #2c3e50;">${escapeHtml(m.name)}</td>
        <td><span class="pill ${m.status === 'ok' ? 'ok' : 'late'}">${m.status === 'ok' ? 'منتظم' : 'متأخر'}</span></td>
        <td style="text-align: left; font-weight: 700; color: #8a6d2f; text-shadow: 0 1px 0 rgba(255,255,255,0.5);">${Number(m.amount).toLocaleString('en-US', { minimumFractionDigits: 2 })} ﷼</td>
      </tr>
    `).join('');
  });
}

loadData();
</script>

<script>
/* =========================================================================
   لوحة التحكم (مشرف فقط): رفع كشف حساب PDF (الراجحي) وفرزه تلقائياً
   ثم إرساله إلى تبويب "سجل_الحوالات" في ملف الإكسل عبر Google Apps Script.
   ========================================================================= */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

// نفس رابط سكربت Google Apps Script المستخدم لجلب البيانات (doGet) يُستخدم أيضاً لاستقبالها (doPost)
const TRANSFER_API_URL = API_URL;

// أنواع الحوالات كما تظهر فعلياً في كشوفات الراجحي (مطابقة لنص الكشف تماماً)
// التصنيف مبسّط لفئتين فقط بناءً على طلب الإدارة
const TRANSFER_TYPES = ["تحويل", "أمر مستديم"];

// نطاقات إحداثي X الافتراضية (تُستخدم فقط إذا تعذّر اكتشاف صف العناوين تلقائياً في الملف)
const DEFAULT_COLS = { balance: 75, credit: 167, debit: 255, date: 508 };

// أعضاء الصندوق الـ27 بالضبط كما في ملف الإكسل (تبويب "ملخص الأعضاء") — الاسم الأول + اسم الأب فقط
const MEMBERS = [
  "عبدالله مطير", "مطير عبدالله", "سعود عبدالله", "محمد عبيدالله", "مساعد عبدالله",
  "فواز عبيدالله", "فيصل عبدالله", "سعد عبدالله", "عبدالهادي عبدالله", "سلمان عبدالله",
  "صلاح عبيدالله", "سلطان عبيدالله", "أحمد عبيدالله", "عبدالعزيز عبيدالله", "فهد عبدالله",
  "عبدالمجيد عبيدالله", "رائد عبدالله", "ياسر عبيدالله", "ثامر عبدالله", "محمد عبدالله",
  "فارس مطير", "مشعل عبدالله", "مشاري عبيدالله", "خالد عبدالله", "بندر عبدالله",
  "عبدالرحمن عبدالله", "عبدالرحمن مطير"
];

// جدول تحويل الأسماء العربية إلى نظائرها اللاتينية الشائعة (لمطابقة "أمر مستديم" الذي يظهر بالإنجليزية فقط في الكشف)
const TRANSLIT = {
  "عبدالله": ["ABDULLAH","ABDALLAH","ABDULLA"],
  "مطير": ["MUTAIR","MOTEER","MTEER","MUTEER","MOTAIR"],
  "عبيدالله": ["OBAIDALLAH","OBEIDALLAH","ABIDALLAH","OBAYDALLAH"],
  "سعود": ["SAUD","SAOUD","SAAOD","SAOD"],
  "محمد": ["MOHAMMED","MOHAMMAD","MUHAMMAD","MOHAMED"],
  "مساعد": ["MUSAAD","MASAAD","MSAAD","MUSAAED"],
  "فواز": ["FAWAZ"],
  "فيصل": ["FAISAL","FAYSAL"],
  "سعد": ["SAAD","SAAED"],
  "عبدالهادي": ["ABDULHADI","ABDALHADI"],
  "سلمان": ["SALMAN"],
  "صلاح": ["SALAH","SALAAH"],
  "سلطان": ["SULTAN"],
  "أحمد": ["AHMED","AHMAD"],
  "عبدالعزيز": ["ABDULAZIZ","ABDULAZEEZ"],
  "فهد": ["FAHAD","FAHD"],
  "عبدالمجيد": ["ABDULMAJEED","ABDULMAJID"],
  "رائد": ["RAED","RAAED","RAID"],
  "ياسر": ["YASIR","YASSER","YASER"],
  "ثامر": ["THAMER","THAMIR"],
  "فارس": ["FARIS","FARES"],
  "مشعل": ["MISHAAL","MASHAL","MISHAL","MESHAL"],
  "مشاري": ["MISHARI","MASHARI"],
  "خالد": ["KHALID","KHALED"],
  "بندر": ["BANDAR","BANDER"],
  "عبدالرحمن": ["ABDULRAHMAN","ABDELRAHMAN"]
};

function normArabic(s) {
  return String(s).replace(/\s+/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه');
}

// مطابقة الاسم العربي المستخرج من الكشف (كلمة واحدة أو أكثر) مع أحد الأعضاء الـ27
function matchMemberArabic(arabicWords) {
  if (!arabicWords || !arabicWords.length) return null;
  const joined = normArabic(arabicWords.join(''));
  let candidates = MEMBERS.filter(m => joined.indexOf(normArabic(m)) === 0);
  if (candidates.length === 1) return candidates[0];
  if (arabicWords.length === 1) {
    const w = normArabic(arabicWords[0]);
    candidates = MEMBERS.filter(m => normArabic(m.split(' ')[0]) === w);
    if (candidates.length === 1) return candidates[0];
  }
  return null;
}

// مطابقة الاسم اللاتيني (حالة "أمر مستديم" حيث لا يظهر اسم عربي في الكشف إطلاقاً) عبر جدول التحويل الصوتي
function matchMemberLatin(latinWords) {
  if (!latinWords || latinWords.length < 2) return null;
  // البحث في الترتيب العكسي أو الأمامي للكلمات اللاتينية لضمان مطابقة الاسم الأول والأب بغض النظر عن اتجاه القراءة
  for (let i = 0; i < latinWords.length - 1; i++) {
    const w1 = latinWords[i].toUpperCase();
    for (let j = i + 1; j < latinWords.length; j++) {
      const w2 = latinWords[j].toUpperCase();
      const candidates = MEMBERS.filter(m => {
        const parts = m.split(' ');
        const v1 = TRANSLIT[parts[0]] || [], v2 = TRANSLIT[parts[1]] || [];
        return (v1.indexOf(w1) !== -1 && v2.indexOf(w2) !== -1) ||
               (v1.indexOf(w2) !== -1 && v2.indexOf(w1) !== -1);
      });
      if (candidates.length === 1) return candidates[0];
    }
  }
  return null;
}

function matchMember(arabicWords, latinWords) {
  return matchMemberArabic(arabicWords) || matchMemberLatin(latinWords);
}

let adminKeyValue = "";
let reviewRows = [];
let rowIdCounter = 0;

document.getElementById('adminTriggerBtn').addEventListener('click', openAdminPanel);

function openAdminPanel() {
  const mount = document.getElementById('adminMount');
  mount.innerHTML = `
    <div class="admin-overlay" id="adminOverlay">
      <div class="admin-modal">
        <button class="admin-close" id="adminCloseBtn" aria-label="إغلاق">×</button>
        <h3>لوحة التحكم — رفع كشف حساب</h3>

        <div class="admin-field">
          <label>مفتاح المشرف (Admin Key)</label>
          <input type="password" id="adminKeyInput" placeholder="أدخل المفتاح السري" autocomplete="off">
        </div>

        <div class="admin-field">
          <label>ملف كشف الحساب (PDF)</label>
          <input type="file" id="pdfFileInput" accept="application/pdf">
          <div class="admin-note">تتم قراءة الملف والتعرف على الحوالات داخل المتصفح فقط، ولا يُرفع ملف الـ PDF نفسه إلى أي خادم.</div>
        </div>

        <div class="admin-actions">
          <button class="admin-btn" id="parsePdfBtn">استخراج الحوالات من الملف</button>
        </div>

        <div id="adminMsg"></div>
        <div id="reviewArea"></div>
      </div>
    </div>
  `;
  document.getElementById('adminCloseBtn').addEventListener('click', closeAdminPanel);
  document.getElementById('adminOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'adminOverlay') closeAdminPanel();
  });
  document.getElementById('adminKeyInput').addEventListener('input', (e) => {
    adminKeyValue = e.target.value;
  });
  document.getElementById('parsePdfBtn').addEventListener('click', handleParsePdf);
}

function closeAdminPanel() {
  document.getElementById('adminMount').innerHTML = '';
  reviewRows = [];
}

function showAdminMsg(text, type) {
  const el = document.getElementById('adminMsg');
  if (!el) return;
  el.innerHTML = `<div class="admin-msg ${type}">${text}</div>`;
}
function showAdminMsgPlain(text, type) { showAdminMsg(escapeHtml(text), type); }

function fixBidi(str) {
  return str.normalize('NFKC');
}

const ARABIC_LABEL_STOP = new Set(['الوقت', 'ملاحظة']);

/* تعديل استخراج الكلمات بناءً على إحداثيات X لضمان الترتيب الصحيح للإنجليزية (من اليسار لليمين) */
function extractWordsFromBand(bandItems) {
  // فرز العناصر في السطر حسب إحداثي X تصاعدياً (من اليسار إلى اليمين)
  const sortedItems = [...bandItems].sort((a, b) => a.x - b.x);
  
  let arabicWords = [];
  let latinWords = [];

  sortedItems.forEach(item => {
    const text = item.text;
    const arMatches = (text.match(/[\u0600-\u06FF]+/g) || []).filter(w => !ARABIC_LABEL_STOP.has(w));
    const enMatches = (text.match(/[A-Za-z]+/g) || []).filter(w => w.length >= 3);
    
    arabicWords.push(...arMatches);
    latinWords.push(...enMatches);
  });

  return { arabicWords, latinWords };
}

function classifyType(typeText) {
  return /مستديم/.test(typeText || '') ? 'أمر مستديم' : 'تحويل';
}

async function extractTransactionsFromPdf(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const transactions = [];
  let lastCols = null;
  const debug = { pages: pdf.numPages, perPage: [] };

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    const rawCount = content.items.length;
    const items = content.items.map(it => ({
      x: it.transform[4],
      y: it.transform[5],
      text: fixBidi(it.str).trim()
    })).filter(it => it.text);

    items.sort((a, b) => b.y - a.y);

    const bands = [];
    let cur = [], lastY = null;
    items.forEach(it => {
      if (lastY === null || Math.abs(it.y - lastY) <= 2.5) {
        cur.push(it);
      } else {
        bands.push(cur);
        cur = [it];
      }
      lastY = it.y;
    });
    if (cur.length) bands.push(cur);

    const pageDebug = { page: p, rawItems: rawCount, keptItems: items.length, bands: bands.length,
                         calibrated: false, anchorsOnPage: 0, sampleItems: items.slice(0, 15).map(i => i.text) };
    debug.perPage.push(pageDebug);
    if (!bands.length) continue;

    let cols = null;
    for (const band of bands) {
      const findLabel = (label) => band.find(i => i.text.indexOf(label) !== -1);
      const bal = findLabel('الرصيد'), cr = findLabel('دائن'), db = findLabel('مدين'), dt = findLabel('التاريخ');
      if (bal && cr && db && dt) {
        cols = { balance: bal.x, credit: cr.x, debit: db.x, date: dt.x };
        break;
      }
    }
    if (cols) pageDebug.calibrated = true;
    if (!cols) cols = lastCols || DEFAULT_COLS;
    lastCols = cols;
    pageDebug.colsUsed = cols;
    const near = (x, center) => Math.abs(x - center) <= 45;

    const flags = bands.map(band => {
      const dateItem = band.find(i => near(i.x, cols.date) && /\d{4}\/\d{2}\/\d{2}/.test(i.text));
      const dateMatch = dateItem ? dateItem.text.match(/\d{4}\/\d{2}\/\d{2}/)[0] : null;
      return { band, isAnchor: !!dateItem, dateText: dateMatch };
    });
    pageDebug.anchorsOnPage = flags.filter(f => f.isAnchor).length;

    let currentTx = null;
    let pendingTypeText = '';

    flags.forEach((f, idx) => {
      if (f.isAnchor) {
        const findAmount = (center) => {
          const it = f.band.find(i => near(i.x, center) && /[\d,]+\.\d{2}/.test(i.text));
          if (!it) return 0;
          const m = it.text.match(/[\d,]+\.\d{2}/);
          return m ? parseFloat(m[0].replace(/,/g, '')) : 0;
        };
        const credit = findAmount(cols.credit);
        if (credit > 0) {
          currentTx = {
            id: 'r' + (rowIdCounter++),
            date: f.dateText,
            type: classifyType(pendingTypeText),
            amount: credit.toFixed(2),
            arabicWords: [],
            latinWords: [],
            rawNote: ''
          };
          transactions.push(currentTx);
        } else {
          currentTx = null;
        }
        pendingTypeText = '';
      } else {
        const sorted = [...f.band].sort((a, b) => b.x - a.x);
        const text = sorted.map(i => i.text).join(' ').replace(/\s+/g, ' ').trim();
        const nextIsAnchor = flags[idx + 1] && flags[idx + 1].isAnchor;
        if (nextIsAnchor) {
          pendingTypeText = text;
        } else if (currentTx) {
          const { arabicWords, latinWords } = extractWordsFromBand(f.band);
          currentTx.arabicWords.push(...arabicWords);
          currentTx.latinWords.push(...latinWords);
          currentTx.rawNote += ' ' + text;
        }
      }
    });
  }

  lastExtractDebug = debug;

  return transactions.map(t => {
    const matched = matchMember(t.arabicWords, t.latinWords);
    return {
      id: t.id,
      date: t.date,
      name: matched || '',
      rawHint: t.arabicWords.join(' ') || t.latinWords.join(' '),
      type: t.type,
      amount: t.amount
    };
  });
}

let lastExtractDebug = null;

async function handleParsePdf() {
  const fileInput = document.getElementById('pdfFileInput');
  if (!adminKeyValue) { showAdminMsgPlain('الرجاء إدخال مفتاح المشرف أولاً.', 'error'); return; }
  if (!fileInput.files.length) { showAdminMsgPlain('الرجاء اختيار ملف PDF.', 'error'); return; }

  showAdminMsgPlain('جاري قراءة الملف...', '');
  try {
    reviewRows = await extractTransactionsFromPdf(fileInput.files[0]);
    if (reviewRows.length === 0) {
      showAdminMsgPlain('لم يتم التعرف تلقائياً على أي عملية داخل الملف.', 'error');
    } else {
      const unmatched = reviewRows.filter(r => !r.name).length;
      const msg = unmatched
        ? `تم استخراج ${reviewRows.length} عملية (${unmatched} منها بحاجة لاختيار الاسم يدوياً). راجع البيانات أدناه قبل الإرسال.`
        : `تم استخراج ${reviewRows.length} عملية وتمّت مطابقة كل الأسماء تلقائياً. راجع البيانات أدناه قبل الإرسال.`;
      showAdminMsgPlain(msg, 'success');
    }
    renderReviewTable();
  } catch (err) {
    showAdminMsgPlain('تعذّرت قراءة الملف: ' + err.message, 'error');
  }
}

function renderReviewTable() {
  const area = document.getElementById('reviewArea');
  if (!reviewRows.length) { area.innerHTML = ''; return; }

  const memberOptions = (selected) => `<option value="">— اختر العضو —</option>` +
    MEMBERS.map(m => `<option value="${m}" ${m === selected ? 'selected' : ''}>${m}</option>`).join('');
  const typeOptionsHtml = (selected) => TRANSFER_TYPES.map(t => `<option value="${t}" ${t === selected ? 'selected' : ''}>${t}</option>`).join('');

  area.innerHTML = `
    <div class="review-table-wrap">
      <table class="review-table">
        <thead><tr><th>التاريخ</th><th>الاسم</th><th>نوع الحوالة</th><th>المبلغ</th><th></th></tr></thead>
        <tbody id="reviewBody"></tbody>
      </table>
    </div>
    <div class="admin-actions">
      <button class="admin-btn secondary" id="addRowBtn">+ إضافة صف يدوياً</button>
      <button class="admin-btn" id="submitRowsBtn">إرسال إلى سجل الحوالات</button>
    </div>
  `;
  document.getElementById('addRowBtn').addEventListener('click', () => {
    reviewRows.push({ id: 'r' + (rowIdCounter++), date: '', name: '', rawHint: '', type: 'تحويل', amount: '' });
    renderReviewTable();
  });
  document.getElementById('submitRowsBtn').addEventListener('click', handleSubmitRows);

  const tbody = document.getElementById('reviewBody');
  tbody.innerHTML = reviewRows.map(r => `
    <tr data-id="${r.id}">
      <td><input type="text" class="f-date" value="${escapeHtml(r.date)}" placeholder="YYYY/MM/DD"></td>
      <td>
        <select class="f-name">${memberOptions(r.name)}</select>
        ${r.rawHint ? `<div class="admin-note" style="margin-top:3px;">${escapeHtml(r.rawHint)}</div>` : ''}
      </td>
      <td><select class="f-type">${typeOptionsHtml(r.type)}</select></td>
      <td><input type="text" class="f-amount" value="${escapeHtml(r.amount)}" placeholder="0.00"></td>
      <td><button class="review-row-del" title="حذف الصف">✕</button></td>
    </tr>
  `).join('');

  tbody.querySelectorAll('tr').forEach(tr => {
    const id = tr.getAttribute('data-id');
    tr.querySelector('.f-date').addEventListener('input', e => updateRow(id, 'date', e.target.value));
    tr.querySelector('.f-name').addEventListener('change', e => updateRow(id, 'name', e.target.value));
    tr.querySelector('.f-type').addEventListener('change', e => updateRow(id, 'type', e.target.value));
    tr.querySelector('.f-amount').addEventListener('input', e => updateRow(id, 'amount', e.target.value));
    tr.querySelector('.review-row-del').addEventListener('click', () => {
      reviewRows = reviewRows.filter(r => r.id !== id);
      renderReviewTable();
    });
  });
}

function updateRow(id, field, value) {
  const row = reviewRows.find(r => r.id === id);
  if (row) row[field] = value;
}

async function handleSubmitRows() {
  if (!reviewRows.length) return;
  const invalid = reviewRows.some(r => !r.date || !r.name || !r.amount);
  if (invalid) {
    showAdminMsgPlain('تأكد من اختيار العضو وتعبئة التاريخ والمبلغ لكل صف قبل الإرسال.', 'error');
    return;
  }

  showAdminMsgPlain('جاري الإرسال...', '');
  const submitBtn = document.getElementById('submitRowsBtn');
  if (submitBtn) submitBtn.disabled = true;

  try {
    const payload = {
      action: 'addTransfers',
      adminKey: adminKeyValue,
      transfers: reviewRows.map(r => ({
        date: r.date, name: r.name, type: r.type, amount: parseFloat(r.amount) || 0
      }))
    };
    const resp = await fetch(TRANSFER_API_URL, { method: 'POST', body: JSON.stringify(payload) });
    const result = await resp.json();

    if (result.success) {
      let msg = `تم إضافة ${result.added} عملية بنجاح إلى سجل الحوالات.`;
      if (result.skippedDuplicates) msg += ` تم تجاهل ${result.skippedDuplicates} عملية مكررة.`;
      showAdminMsgPlain(msg, 'success');
      reviewRows = [];
      document.getElementById('reviewArea').innerHTML = '';
      loadData();
    } else {
      showAdminMsgPlain('فشل الإرسال: ' + (result.error || 'خطأ غير معروف'), 'error');
    }
  } catch (err) {
    showAdminMsgPlain('تعذّر الاتصال بالسكربت: ' + err.message, 'error');
  } finally {
    if (submitBtn) submitBtn.disabled = false;
  }
}
</script>
</body>
</html>
